[package]
name = "membank"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace]
members = ["gui"]

[profile.release]
lto = true
codegen-units = 1
